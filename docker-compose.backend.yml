services:
  portfolio_back:
    image: ${IMAGE:-registry.gitlab.andrewbalanel.com/ib/react-portfolio-backend:latest}
    build:
      context: ./portfolio-back
    restart: unless-stopped
    environment:
      PORT: 8000
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-portfolio_root_password}@mongo:27017/portfolio?authSource=admin
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://irinabalanel.com,http://localhost:5173}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      mongo_seed:
        condition: service_completed_successfully
    networks:
      - irina_portfolio

  mongo:
    image: mongo:4.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-portfolio_root_password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - irina_portfolio

  mongo_seed:
    image: mongo:4.4
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./portfolio-back/db/seed:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mongoimport --host mongo --username root --password ${MONGO_ROOT_PASSWORD:-portfolio_root_password} --authenticationDatabase admin --db portfolio --collection projects --drop --jsonArray --file /seed/projects.json &&
      mongoimport --host mongo --username root --password ${MONGO_ROOT_PASSWORD:-portfolio_root_password} --authenticationDatabase admin --db portfolio --collection skills --drop --jsonArray --file /seed/skills.json &&
      mongoimport --host mongo --username root --password ${MONGO_ROOT_PASSWORD:-portfolio_root_password} --authenticationDatabase admin --db portfolio --collection messages --drop --jsonArray --file /seed/messages.json
    networks:
      - irina_portfolio

volumes:
  mongo_data:

networks:
  irina_portfolio:
    name: irina_portfolio
