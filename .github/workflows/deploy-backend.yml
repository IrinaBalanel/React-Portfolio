name: Backend CI/CD

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      IMAGE_REPOSITORY: ${{ secrets.CONTAINER_IMAGE_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_DIR: /opt/irinabalanel-api
      HOSTING_LXC_ID: ${{ secrets.HOSTING_LXC_ID }}
      PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      CONTAINER_REGISTRY_HOST: ${{ secrets.CONTAINER_REGISTRY_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY_HOST }}
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        run: |
          set -euo pipefail
          docker build -f portfolio-back/Dockerfile -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" -t "${IMAGE_REPOSITORY}:main" ./portfolio-back
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${IMAGE_REPOSITORY}:main"

      - name: Prepare deploy env
        run: |
          cat > deploy.env <<'ENV'
          IMAGE=${IMAGE_REPOSITORY}:${IMAGE_TAG}
          APP_PORT=8000
          MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
          ALLOWED_ORIGINS=https://irinabalanel.com,http://localhost:5173
          ENV

      - name: Configure SSH key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROXMOX_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose/env and seed data to hosting LXC via Proxmox
        run: |
          set -euo pipefail
          ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- mkdir -p ${DEPLOY_DIR}/portfolio-back/db/seed"
          ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > ${DEPLOY_DIR}/docker-compose.backend.yml'" < docker-compose.backend.yml
          ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > ${DEPLOY_DIR}/.env'" < deploy.env
          ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > ${DEPLOY_DIR}/portfolio-back/db/seed/projects.json'" < portfolio-back/db/seed/projects.json
          ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > ${DEPLOY_DIR}/portfolio-back/db/seed/skills.json'" < portfolio-back/db/seed/skills.json
          ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > ${DEPLOY_DIR}/portfolio-back/db/seed/messages.json'" < portfolio-back/db/seed/messages.json

      - name: Deploy on hosting LXC
        run: |
          set -euo pipefail
          ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cd ${DEPLOY_DIR} && docker compose -f docker-compose.backend.yml pull && docker compose -f docker-compose.backend.yml up -d --remove-orphans'"

      - name: Smoke test
        run: curl -fsS https://irinabalanel.com/api/projects >/dev/null
