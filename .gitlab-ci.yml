stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE/backend"
  BACKEND_IMAGE_TAG: "$CI_COMMIT_SHA"
  FRONTEND_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE/frontend"
  FRONTEND_IMAGE_TAG: "$CI_COMMIT_SHA"

build:backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/portfolio-back" --dockerfile "$CI_PROJECT_DIR/portfolio-back/Dockerfile" --destination "$BACKEND_IMAGE_REPOSITORY:$BACKEND_IMAGE_TAG" --destination "$BACKEND_IMAGE_REPOSITORY:main"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/portfolio-front" --dockerfile "$CI_PROJECT_DIR/portfolio-front/Dockerfile" --build-arg "VITE_API_URL=https://irinabalanel.com" --destination "$FRONTEND_IMAGE_REPOSITORY:$FRONTEND_IMAGE_TAG" --destination "$FRONTEND_IMAGE_REPOSITORY:main"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:backend:
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -euo pipefail
      deploy_user="${DEPLOY_USER:-root}"
      deploy_dir="/opt/irinabalanel-api"
      cat > deploy.env <<ENV
      IMAGE=${BACKEND_IMAGE_REPOSITORY}:${BACKEND_IMAGE_TAG}
      APP_PORT=8000
      MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      ALLOWED_ORIGINS=https://irinabalanel.com,http://localhost:5173
      ENV
      ssh "${deploy_user}@${DEPLOY_HOST}" "mkdir -p ${deploy_dir}/portfolio-back/db/seed"
      ssh "${deploy_user}@${DEPLOY_HOST}" "cat > ${deploy_dir}/docker-compose.backend.yml" < docker-compose.backend.yml
      ssh "${deploy_user}@${DEPLOY_HOST}" "cat > ${deploy_dir}/.env" < deploy.env
      ssh "${deploy_user}@${DEPLOY_HOST}" "cat > ${deploy_dir}/portfolio-back/db/seed/projects.json" < portfolio-back/db/seed/projects.json
      ssh "${deploy_user}@${DEPLOY_HOST}" "cat > ${deploy_dir}/portfolio-back/db/seed/skills.json" < portfolio-back/db/seed/skills.json
      ssh "${deploy_user}@${DEPLOY_HOST}" "cat > ${deploy_dir}/portfolio-back/db/seed/messages.json" < portfolio-back/db/seed/messages.json
      ssh "${deploy_user}@${DEPLOY_HOST}" "cd ${deploy_dir} && docker compose -f docker-compose.backend.yml pull && docker compose -f docker-compose.backend.yml up -d --remove-orphans"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:frontend-static:
  stage: deploy
  image: node:20-alpine
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - echo "$CADDY_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$CADDY_DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - cd portfolio-front
    - npm ci
    - VITE_API_URL=https://irinabalanel.com npm run build
    - tar -czf ../dist.tar.gz -C dist .
    - scp ../dist.tar.gz "${CADDY_DEPLOY_USER}@${CADDY_DEPLOY_HOST}:/tmp/irinabalanel-com-${CI_COMMIT_SHA}.tar.gz"
    - |
      ssh "${CADDY_DEPLOY_USER}@${CADDY_DEPLOY_HOST}" "
        set -euo pipefail
        target=/opt/caddy/www/irinabalanel/irinabalanel-com
        tmp=\"\${target}.new.${CI_COMMIT_SHA}\"
        rm -rf \"\$tmp\"
        mkdir -p \"\$tmp\"
        tar -xzf /tmp/irinabalanel-com-${CI_COMMIT_SHA}.tar.gz -C \"\$tmp\"
        rm -f /tmp/irinabalanel-com-${CI_COMMIT_SHA}.tar.gz
        rm -rf \"\$target\"
        mv \"\$tmp\" \"\$target\"
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
