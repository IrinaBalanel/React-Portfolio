stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE/backend"
  BACKEND_IMAGE_TAG: "$CI_COMMIT_SHA"
  FRONTEND_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE/frontend"
  FRONTEND_IMAGE_TAG: "$CI_COMMIT_SHA"

build:backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/portfolio-back" --dockerfile "$CI_PROJECT_DIR/portfolio-back/Dockerfile" --destination "$BACKEND_IMAGE_REPOSITORY:$BACKEND_IMAGE_TAG" --destination "$BACKEND_IMAGE_REPOSITORY:main"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/portfolio-front" --dockerfile "$CI_PROJECT_DIR/portfolio-front/Dockerfile" --build-arg "VITE_API_URL=https://irinabalanel.com" --destination "$FRONTEND_IMAGE_REPOSITORY:$FRONTEND_IMAGE_TAG" --destination "$FRONTEND_IMAGE_REPOSITORY:main"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:backend:
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - echo "$PROXMOX_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$PROXMOX_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -euo pipefail
      cat > deploy.env <<ENV
      IMAGE=${BACKEND_IMAGE_REPOSITORY}:${BACKEND_IMAGE_TAG}
      APP_PORT=8000
      MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      ALLOWED_ORIGINS=https://irinabalanel.com,http://localhost:5173
      ENV
      ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- mkdir -p /opt/irinabalanel-api/portfolio-back/db/seed"
      ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > /opt/irinabalanel-api/docker-compose.backend.yml'" < docker-compose.backend.yml
      ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > /opt/irinabalanel-api/.env'" < deploy.env
      ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > /opt/irinabalanel-api/portfolio-back/db/seed/projects.json'" < portfolio-back/db/seed/projects.json
      ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > /opt/irinabalanel-api/portfolio-back/db/seed/skills.json'" < portfolio-back/db/seed/skills.json
      ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cat > /opt/irinabalanel-api/portfolio-back/db/seed/messages.json'" < portfolio-back/db/seed/messages.json
      ssh "${PROXMOX_USER}@${PROXMOX_HOST}" "pct exec ${HOSTING_LXC_ID} -- bash -lc 'cd /opt/irinabalanel-api && docker compose -f docker-compose.backend.yml pull && docker compose -f docker-compose.backend.yml up -d --remove-orphans'"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
